<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
        }

        body {
            font-family: 'Reross Quadratic', 'Space Mono', monospace;
            background-color: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plakato Inline Pro', 'Space Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 0.25rem 2rem;
            background: rgba(255, 255, 255, 0.98);
            z-index: 100;
            border-bottom: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        header.scrolled {
            padding: 0.25rem 2rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .header-title {
            font-size: 1.25rem;
            letter-spacing: 0.08em;
        }

        body {
            padding-top: 50px;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            margin-bottom: 4rem;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            padding: 4rem;
            color: white;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .hero-text p {
            font-size: 1.2rem;
            max-width: 600px;
            letter-spacing: 0.05em;
        }

        /* Main Container */
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 1.2rem;
        }

        /* Masonry Gallery */
        .gallery {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 2rem;
        }

        .gallery-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            align-items: stretch;
            justify-content: flex-start;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
            background-color: transparent;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .gallery-item.landscape {
            /* Natural sizing */
        }

        .gallery-item:hover {
            border-color: #1a1a1a;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 3rem;
            cursor: pointer;
            user-select: none;
            padding: 2rem;
            z-index: 10;
        }

        .modal-prev {
            left: 0;
        }

        .modal-next {
            right: 0;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 3rem 4rem;
            margin-top: 6rem;
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                padding: 0 2rem;
            }

            header {
                padding: 1.5rem 2rem;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 0 1rem;
            }

            header {
                padding: 1rem;
            }

            .hero {
                height: 50vh;
            }

            .hero-text h1 {
                font-size: 1.75rem;
            }

            .hero-overlay {
                padding: 2rem;
            }

            .modal-nav {
                font-size: 2rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" style="text-decoration: none;">
                <img src="logo.png" alt="Fotos by Ben" style="height: 30px; width: auto;">
            </a>
            <nav style="display: flex; gap: 2rem;">
                <a href="index.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">Gallery</a>
                <a href="editorials/index.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">Editorials</a>
                <a href="about.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">About</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <img id="hero-image" src="hero.jpg" alt="Hero Image">
        <div class="hero-overlay">
            <div class="hero-text">
                <h1>Visual Stories</h1>
                <p>A curated collection exploring the interaction between the natural, built and human<br>environments</p>
            </div>
        </div>
    </section>

    <main>
        <div class="gallery" id="gallery"></div>
    </main>

    <footer>
        <p>© 2026 Photography Portfolio. All rights reserved.</p>
    </footer>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal">
        <span class="modal-close" id="modal-close">&times;</span>
        <span class="modal-nav modal-prev" id="modal-prev">&lt;</span>
        <div class="modal-content">
            <img class="modal-image" id="modal-image" src="" alt="">
        </div>
        <span class="modal-nav modal-next" id="modal-next">&gt;</span>
    </div>

    <script>
        // Image data - portfolio images
        const images = [
            '001.jpeg', '002.jpeg', '003.jpeg', '004.jpeg', '005.jpeg', '006.jpeg', '007.jpeg', '008.jpeg', '009.jpeg', '010.jpeg',
            '011.jpeg', '012.jpeg', '013.jpeg', '014.jpeg', '015.jpeg', '016.jpeg', '017.jpeg', '018.jpeg', '019.jpeg', '020.jpeg',
            '021.jpeg', '022.jpeg', '023.jpeg', '024.jpeg', '025.jpeg', '026.jpeg', '027.jpeg', '028.jpeg', '029.jpeg', '030.jpeg',
            '031.jpeg', '032.jpeg', '033.jpeg', '034.jpeg', '035.jpeg', '036.jpeg', '037.jpeg', '038.jpeg', '039.jpeg', '040.jpeg',
            '041.jpeg', '042.jpeg', '043.jpeg', '044.jpeg', '045.jpeg', '046.jpeg', '047.jpeg', '048.jpeg', '049.jpeg', '050.jpeg',
            '051.jpeg', '052.jpeg', '053.jpeg', '054.jpeg', '055.jpeg', '056.jpeg', '057.jpeg', '058.jpeg', '059.jpeg', '060.jpeg',
            '061.jpeg', '062.jpeg', '063.jpeg', '064.jpeg', '065.jpeg', '066.jpeg', '067.jpeg'
        ];

        let currentModalIndex = 0;

        // Initialize gallery - fast render
        function initializeGallery() {
            const gallery = document.getElementById('gallery');
            const columns = [[], [], []];

            // Fast distribution across 3 columns
            images.forEach((img, index) => {
                columns[index % 3].push({img, index});
            });

            // Render columns immediately
            columns.forEach((columnItems, colIdx) => {
                const column = document.createElement('div');
                column.className = 'gallery-column';

                columnItems.forEach(({img, index}) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    const imgElement = document.createElement('img');
                    imgElement.dataset.src = `optimized/${img}`;
                    imgElement.alt = 'Photograph';
                    imgElement.style.backgroundColor = '#f0f0f0';

                    imgElement.onload = function() {
                        if (this.naturalWidth > this.naturalHeight) {
                            item.classList.add('landscape');
                        }
                        this.style.backgroundColor = 'transparent';
                    };

                    item.appendChild(imgElement);
                    item.addEventListener('click', () => openModal(index));
                    column.appendChild(item);
                });

                gallery.appendChild(column);
            });

            // Sequential column-by-column loading: left → middle → right
            const allImages = document.querySelectorAll('img[data-src]');

            // Create loading order: column 0 (0,3,6...), then column 1 (1,4,7...), then column 2 (2,5,8...)
            const loadOrder = [];
            for (let col = 0; col < 3; col++) {
                for (let row = 0; row < images.length; row++) {
                    const index = row * 3 + col;
                    if (index < allImages.length) {
                        loadOrder.push(index);
                    }
                }
            }

            let loadIndex = 0;

            function loadNextImage() {
                if (loadIndex < loadOrder.length) {
                    const imgIndex = loadOrder[loadIndex];
                    const img = allImages[imgIndex];
                    if (img) {
                        img.src = img.dataset.src;
                    }
                    loadIndex++;
                    // Load next image after a small delay to smooth bandwidth usage
                    setTimeout(loadNextImage, 50);
                }
            }

            // Start loading immediately
            loadNextImage();
        }

        // Modal functions
        function openModal(index) {
            currentModalIndex = index;
            updateModalImage();
            document.getElementById('imageModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        function updateModalImage() {
            const img = document.getElementById('modal-image');
            img.src = `optimized/${images[currentModalIndex]}`;
        }

        function prevImage() {
            currentModalIndex = (currentModalIndex - 1 + images.length) % images.length;
            updateModalImage();
        }

        function nextImage() {
            currentModalIndex = (currentModalIndex + 1) % images.length;
            updateModalImage();
        }

// Header scroll effect
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            lastScrollTop = window.scrollY;
        });

        // Event listeners
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-prev').addEventListener('click', prevImage);
        document.getElementById('modal-next').addEventListener('click', nextImage);

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') closeModal();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('imageModal').classList.contains('show')) return;
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'Escape') closeModal();
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initializeGallery();
        });
    </script>
</body>
</html>
