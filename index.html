<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
        }

        body {
            font-family: 'Reross Quadratic', 'Space Mono', monospace;
            background-color: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
            zoom: 75%;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plakato Inline Pro', 'Space Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem 4rem;
            background: rgba(255, 255, 255, 0.98);
            z-index: 100;
            border-bottom: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        header.scrolled {
            padding: 1rem 4rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .header-title {
            font-size: 1.25rem;
            letter-spacing: 0.08em;
        }

        body {
            padding-top: 80px;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            margin-bottom: 4rem;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            padding: 4rem;
            color: white;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .hero-text p {
            font-size: 1.2rem;
            max-width: 600px;
            letter-spacing: 0.05em;
        }

        /* Main Container */
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 1.2rem;
        }

        /* Masonry Gallery */
        .gallery {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 2rem;
        }

        .gallery-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            align-items: stretch;
            justify-content: flex-start;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
            background-color: transparent;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .gallery-item.landscape {
            /* Natural sizing */
        }

        .gallery-item:hover {
            border-color: #1a1a1a;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* About Section */
        .about-section {
            max-width: 900px;
            margin: 8rem auto;
            padding: 4rem;
            background: #ffffff;
            border: 1px solid #e0e0e0;
        }

        .about-section h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 3px solid #1a1a1a;
            display: inline-block;
        }

        .about-content {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.8;
            min-height: 300px;
        }

        .about-content.empty {
            color: #999;
            font-style: italic;
        }

        .edit-about-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            color: white;
            border: none;
            cursor: pointer;
            font-family: 'Reross Quadratic', 'Space Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .edit-about-btn:hover {
            background: #333;
        }

        /* Edit Modal */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .edit-modal.show {
            display: flex;
        }

        .edit-modal-content {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 3rem;
            border: 1px solid #d0d0d0;
            max-height: 90vh;
            overflow-y: auto;
        }

        .edit-modal h3 {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }

        .edit-modal textarea {
            width: 100%;
            min-height: 400px;
            padding: 1rem;
            border: 1px solid #d0d0d0;
            font-family: 'Reross Quadratic', 'Space Mono', monospace;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .modal-buttons button {
            padding: 0.75rem 1.5rem;
            border: none;
            cursor: pointer;
            font-family: 'Reross Quadratic', 'Space Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: #1a1a1a;
            color: white;
        }

        .btn-save:hover {
            background: #333;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #1a1a1a;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 3rem;
            cursor: pointer;
            user-select: none;
            padding: 2rem;
            z-index: 10;
        }

        .modal-prev {
            left: 0;
        }

        .modal-next {
            right: 0;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 3rem 4rem;
            margin-top: 6rem;
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                padding: 0 2rem;
            }

            header {
                padding: 1.5rem 2rem;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 0 1rem;
            }

            header {
                padding: 1rem;
            }

            .hero {
                height: 50vh;
            }

            .hero-text h1 {
                font-size: 1.75rem;
            }

            .hero-overlay {
                padding: 2rem;
            }

            .about-section {
                margin: 4rem auto;
                padding: 2rem;
            }

            .modal-nav {
                font-size: 2rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="header-title">Fotos by Ben</h1>
            <nav>
                <a href="about.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">About</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <img id="hero-image" src="hero.jpg" alt="Hero Image">
        <div class="hero-overlay">
            <div class="hero-text">
                <h1>Visual Stories</h1>
                <p>A curated collection exploring light, form, and human experience through the lens.</p>
            </div>
        </div>
    </section>

    <main>
        <div class="gallery" id="gallery"></div>
    </main>

    <section class="about-section">
        <h2>About</h2>
        <div class="about-content empty" id="about-content">
            <p>Tell your story here. Click the button below to add your about section.</p>
        </div>
        <button class="edit-about-btn" id="edit-btn">Edit</button>
    </section>

    <footer>
        <p>© 2026 Photography Portfolio. All rights reserved.</p>
    </footer>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal">
        <span class="modal-close" id="modal-close">&times;</span>
        <span class="modal-nav modal-prev" id="modal-prev">&lt;</span>
        <div class="modal-content">
            <img class="modal-image" id="modal-image" src="" alt="">
        </div>
        <span class="modal-nav modal-next" id="modal-next">&gt;</span>
    </div>

    <!-- Edit About Modal -->
    <div class="edit-modal" id="editModal">
        <div class="edit-modal-content">
            <h3>Edit About</h3>
            <textarea id="about-textarea" placeholder="Write your about section here..."></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" id="cancel-btn">Cancel</button>
                <button class="btn-save" id="save-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Image data - portfolio images
        const images = [
            '001.jpeg', '002.jpeg', '003.jpeg', '004.jpeg', '005.jpeg', '006.jpeg', '007.jpeg', '008.jpeg', '009.jpeg', '010.jpeg',
            '011.jpeg', '012.jpeg', '013.jpeg', '014.jpeg', '015.jpeg', '016.jpeg', '017.jpeg', '018.jpeg', '019.jpeg', '020.jpeg',
            '021.jpeg', '022.jpeg', '023.jpeg', '024.jpeg', '025.jpeg', '026.jpeg', '027.jpeg', '028.jpeg', '029.jpeg', '030.jpeg',
            '031.jpeg', '032.jpeg', '033.jpeg', '034.jpeg', '035.jpeg', '036.jpeg', '037.jpeg', '038.jpeg', '039.jpeg', '040.jpeg',
            '041.jpeg', '042.jpeg', '043.jpeg', '044.jpeg', '045.jpeg', '046.jpeg', '047.jpeg', '048.jpeg', '049.jpeg', '050.jpeg',
            '051.jpeg', '052.jpeg', '053.jpeg', '054.jpeg', '055.jpeg', '056.jpeg', '057.jpeg', '058.jpeg', '059.jpeg', '060.jpeg',
            '061.jpeg', '062.jpeg', '063.jpeg', '064.jpeg', '065.jpeg', '066.jpeg', '067.jpeg', '068.jpeg', '069.jpeg'
        ];

        let currentModalIndex = 0;

        // Initialize gallery with smart masonry
        function initializeGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            // Load all images and measure dimensions
            const imagePromises = images.map((img, index) => {
                return new Promise((resolve) => {
                    const tempImg = new Image();
                    tempImg.onload = function() {
                        const aspectRatio = this.naturalWidth / this.naturalHeight;
                        const estimatedHeight = 320 / aspectRatio;
                        resolve({img, index, height: estimatedHeight});
                    };
                    tempImg.onerror = function() {
                        resolve({img, index, height: 320});
                    };
                    tempImg.src = `optimized/${img}`;
                });
            });

            Promise.all(imagePromises).then(imageData => {
                const columns = [[], [], []];
                const columnHeights = [0, 0, 0];

                // Smart masonry: add each image to the shortest column
                imageData.forEach(({img, index, height}) => {
                    const minIndex = columnHeights.indexOf(Math.min(...columnHeights));
                    columns[minIndex].push({img, index});
                    columnHeights[minIndex] += height + 0.4;
                });

                console.log('Total images:', images.length);
                console.log('Column 0 count:', columns[0].length, '| Height:', columnHeights[0].toFixed(0));
                console.log('Column 1 count:', columns[1].length, '| Height:', columnHeights[1].toFixed(0));
                console.log('Column 2 count:', columns[2].length, '| Height:', columnHeights[2].toFixed(0));

                // Render columns
                for (let colIdx = 0; colIdx < columns.length; colIdx++) {
                    const column = document.createElement('div');
                    column.className = 'gallery-column';

                    for (let itemIdx = 0; itemIdx < columns[colIdx].length; itemIdx++) {
                        const {img, index} = columns[colIdx][itemIdx];
                        const item = document.createElement('div');
                        item.className = 'gallery-item';
                        const imgElement = document.createElement('img');
                        imgElement.src = `optimized/${img}`;
                        imgElement.alt = 'Photograph';
                        imgElement.loading = 'lazy';

                        imgElement.onload = function() {
                            if (this.naturalWidth > this.naturalHeight) {
                                item.classList.add('landscape');
                            }
                        };

                        item.appendChild(imgElement);
                        item.addEventListener('click', () => openModal(index));
                        column.appendChild(item);
                    }

                    gallery.appendChild(column);
                }
            });
        }

        // Modal functions
        function openModal(index) {
            currentModalIndex = index;
            updateModalImage();
            document.getElementById('imageModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        function updateModalImage() {
            const img = document.getElementById('modal-image');
            img.src = `optimized/${images[currentModalIndex]}`;
        }

        function prevImage() {
            currentModalIndex = (currentModalIndex - 1 + images.length) % images.length;
            updateModalImage();
        }

        function nextImage() {
            currentModalIndex = (currentModalIndex + 1) % images.length;
            updateModalImage();
        }

        // About section
        function loadAbout() {
            const saved = localStorage.getItem('about-content');
            if (saved) {
                document.getElementById('about-content').innerHTML = saved;
                document.getElementById('about-content').classList.remove('empty');
            }
        }

        function editAbout() {
            const current = localStorage.getItem('about-content') || '';
            document.getElementById('about-textarea').value = current.replace(/<br>/g, '\n');
            document.getElementById('editModal').classList.add('show');
        }

        function saveAbout() {
            const text = document.getElementById('about-textarea').value;
            const html = text.split('\n').map(p => p.trim()).filter(p => p).join('<br>');
            localStorage.setItem('about-content', html);
            document.getElementById('about-content').innerHTML = html;
            document.getElementById('about-content').classList.remove('empty');
            document.getElementById('editModal').classList.remove('show');
        }

        function cancelEdit() {
            document.getElementById('editModal').classList.remove('show');
        }

        // Header scroll effect
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            lastScrollTop = window.scrollY;
        });

        // Event listeners
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-prev').addEventListener('click', prevImage);
        document.getElementById('modal-next').addEventListener('click', nextImage);
        document.getElementById('edit-btn').addEventListener('click', editAbout);
        document.getElementById('save-btn').addEventListener('click', saveAbout);
        document.getElementById('cancel-btn').addEventListener('click', cancelEdit);

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') closeModal();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('imageModal').classList.contains('show')) return;
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'Escape') closeModal();
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initializeGallery();
            loadAbout();
        });
    </script>
</body>
</html>
