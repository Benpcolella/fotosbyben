<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
        }

        body {
            font-family: 'Reross Quadratic', 'Space Mono', monospace;
            background-color: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
            zoom: 70%;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plakato Inline Pro', 'Space Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 0.25rem 2rem;
            background: rgba(255, 255, 255, 0.98);
            z-index: 100;
            border-bottom: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        header.scrolled {
            padding: 0.25rem 2rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .header-title {
            font-size: 1.25rem;
            letter-spacing: 0.08em;
        }

        body {
            padding-top: 35px;
        }

        /* Hero */
        .hero {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            margin-bottom: 4rem;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            padding: 4rem;
            color: white;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .hero-text p {
            font-size: 1.2rem;
            max-width: 600px;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
        }

        .hero-cta {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .cta-button {
            padding: 0.75rem 1.5rem;
            border: 2px solid white;
            background: transparent;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            font-family: 'Space Mono', monospace;
        }

        .cta-button:hover {
            background: white;
            color: #1a1a1a;
        }

        /* Main Container */
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 1.2rem;
        }

        /* Masonry gallery: photos keep their own proportions, filled in file order */
        .gallery {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 2rem;
        }

        .gallery-column {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            background-color: #f0f0f0;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .gallery-item:hover {
            border-color: #1a1a1a;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            transform: translateY(-4px);
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 3rem;
            cursor: pointer;
            user-select: none;
            padding: 2rem;
            z-index: 10;
        }

        .modal-prev {
            left: 0;
        }

        .modal-next {
            right: 0;
        }

        /* Post-Portfolio CTA */
        .post-portfolio-cta {
            background-color: #f5f5f5;
            padding: 4rem;
            margin: 6rem auto 0;
            max-width: 1600px;
            text-align: center;
        }

        .post-portfolio-cta h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .post-portfolio-cta p {
            font-size: 1rem;
            max-width: 700px;
            margin: 0 auto 2rem;
            line-height: 1.8;
            color: #555;
        }

        .post-portfolio-cta a {
            color: #1a1a1a;
            text-decoration: none;
            border-bottom: 2px solid #1a1a1a;
            transition: opacity 0.3s ease;
        }

        .post-portfolio-cta a:hover {
            opacity: 0.6;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 3rem 4rem;
            margin-top: 0;
            text-align: center;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        footer a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid #ffffff;
            transition: opacity 0.3s ease;
        }

        footer a:hover {
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            main {
                padding: 0 2rem;
            }

            header {
                padding: 1.5rem 2rem;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            main {
                padding: 0 1rem;
            }

            header {
                padding: 1rem;
            }

            .hero {
                height: 50vh;
            }

            .hero-text h1 {
                font-size: 1.75rem;
            }

            .hero-overlay {
                padding: 2rem;
            }

            .modal-nav {
                font-size: 2rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header id="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" style="text-decoration: none;">
                <img src="logo.png" alt="Fotos by Ben" style="height: 30px; width: auto;">
            </a>
            <nav style="display: flex; gap: 2rem;">
                <a href="index.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">Gallery</a>
                <a href="about.html" style="color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease;" onmouseover="this.style.opacity='0.6'" onmouseout="this.style.opacity='1'">About</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <img id="hero-image" src="hero.jpg" alt="Hero Image">
        <div class="hero-overlay">
            <div class="hero-text">
                <h1>Visual Stories</h1>
                <p>A curated collection of images from across the world</p>
            </div>
        </div>
    </section>

    <main>
        <div class="gallery" id="gallery"></div>
    </main>

    <section class="post-portfolio-cta">
        <p>Email <a href="mailto:benpcolella@gmail.com">benpcolella@gmail.com</a>.</p>
    </section>

    <footer>
        <p>© 2026 Benedetto Colella | Always accepting new collaborations</p>
        <p style="margin-top: 1rem; font-size: 0.9rem;">Email: <a href="mailto:benpcolella@gmail.com">benpcolella@gmail.com</a> | Instagram: <a href="https://instagram.com/benedetto.jpeg" target="_blank">@benedetto.jpeg</a></p>
    </footer>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal">
        <span class="modal-close" id="modal-close">&times;</span>
        <span class="modal-nav modal-prev" id="modal-prev">&lt;</span>
        <div class="modal-content">
            <img class="modal-image" id="modal-image" src="" alt="">
        </div>
        <span class="modal-nav modal-next" id="modal-next">&gt;</span>
    </div>

    <script>
        // Image data - portfolio images
        const images = [
            { file: '1.jpg', w: 600, h: 900 }, { file: '2.jpg', w: 720, h: 900 }, { file: '3.jpg', w: 600, h: 900 },
            { file: '4.jpg', w: 600, h: 900 }, { file: '5.jpg', w: 600, h: 900 }, { file: '6.jpg', w: 720, h: 900 },
            { file: '7.jpg', w: 600, h: 900 }, { file: '8.jpg', w: 720, h: 900 }, { file: '9.jpg', w: 600, h: 900 },
            { file: '10.jpg', w: 600, h: 900 }, { file: '11.jpg', w: 900, h: 600 }, { file: '12.jpg', w: 600, h: 900 },
            { file: '13.jpg', w: 600, h: 900 }, { file: '14.jpg', w: 600, h: 900 }, { file: '15.jpg', w: 720, h: 900 },
            { file: '16.jpg', w: 720, h: 900 }, { file: '17.jpg', w: 600, h: 900 }, { file: '18.jpg', w: 600, h: 900 },
            { file: '19.jpg', w: 600, h: 900 }, { file: '20.jpg', w: 720, h: 900 }, { file: '21.jpg', w: 600, h: 900 },
            { file: '22.jpg', w: 600, h: 900 }, { file: '23.jpg', w: 720, h: 900 }, { file: '24.jpg', w: 600, h: 900 },
            { file: '25.jpg', w: 720, h: 900 }, { file: '26.jpg', w: 600, h: 900 }, { file: '27.jpg', w: 600, h: 900 },
            { file: '28.jpg', w: 720, h: 900 }, { file: '29.jpg', w: 600, h: 900 }, { file: '30.jpg', w: 600, h: 900 },
            { file: '31.jpg', w: 600, h: 900 }, { file: '32.jpg', w: 600, h: 900 }, { file: '33.jpg', w: 720, h: 900 },
            { file: '34.jpg', w: 720, h: 900 }, { file: '35.jpg', w: 720, h: 900 }, { file: '36.jpg', w: 900, h: 600 },
            { file: '37.jpg', w: 720, h: 900 }, { file: '38.jpg', w: 600, h: 900 }, { file: '39.jpg', w: 600, h: 900 },
            { file: '40.jpg', w: 720, h: 900 }, { file: '41.jpg', w: 720, h: 900 }, { file: '42.jpg', w: 600, h: 900 },
            { file: '43.jpg', w: 600, h: 900 }, { file: '44.jpg', w: 600, h: 900 }, { file: '45.jpg', w: 720, h: 900 },
            { file: '46.jpg', w: 600, h: 900 }, { file: '47.jpg', w: 900, h: 600 }, { file: '48.jpg', w: 600, h: 900 },
            { file: '49.jpg', w: 600, h: 900 }, { file: '50.jpg', w: 720, h: 900 }, { file: '51.jpg', w: 600, h: 900 },
            { file: '52.jpg', w: 720, h: 900 }, { file: '53.jpg', w: 600, h: 900 }, { file: '54.jpg', w: 720, h: 900 },
            { file: '55.jpg', w: 600, h: 900 }, { file: '56.jpg', w: 720, h: 900 }, { file: '57.jpg', w: 600, h: 900 },
            { file: '58.jpg', w: 600, h: 900 }, { file: '59.jpg', w: 600, h: 900 }, { file: '60.jpg', w: 600, h: 900 },
            { file: '61.jpg', w: 720, h: 900 }, { file: '62.jpg', w: 600, h: 900 }, { file: '63.jpg', w: 600, h: 900 },
            { file: '64.jpg', w: 600, h: 900 }, { file: '65.jpg', w: 600, h: 900 }, { file: '66.jpg', w: 600, h: 900 },
            { file: '67.jpg', w: 900, h: 600 }, { file: '68.jpg', w: 600, h: 900 }, { file: '69.jpg', w: 600, h: 900 },
            { file: '70.jpg', w: 600, h: 900 }, { file: '71.jpg', w: 600, h: 900 }, { file: '72.jpg', w: 600, h: 900 },
            { file: '73.jpg', w: 600, h: 900 }, { file: '74.jpg', w: 600, h: 900 }
        ];

        let currentModalIndex = 0;

        // Masonry gallery: each photo goes into the shortest column, in file order
        let galleryColumnCount = 0;

        function layoutGallery() {
            const gallery = document.getElementById('gallery');
            const count = window.innerWidth <= 600 ? 2 : 3;
            if (count === galleryColumnCount) return;
            galleryColumnCount = count;
            gallery.innerHTML = '';

            const columns = [];
            const heights = [];
            for (let c = 0; c < count; c++) {
                const column = document.createElement('div');
                column.className = 'gallery-column';
                gallery.appendChild(column);
                columns.push(column);
                heights.push(0);
            }

            images.forEach((photo, index) => {
                const c = heights.indexOf(Math.min(...heights));
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const imgElement = document.createElement('img');
                imgElement.src = `thumbs/${photo.file}`;
                imgElement.width = photo.w;
                imgElement.height = photo.h;
                imgElement.alt = 'Photograph';
                imgElement.loading = 'lazy';
                imgElement.decoding = 'async';

                item.appendChild(imgElement);
                item.addEventListener('click', () => openModal(index));
                columns[c].appendChild(item);
                heights[c] += photo.h / photo.w;
            });
        }

        function initializeGallery() {
            layoutGallery();
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(layoutGallery, 150);
            });
        }

        // Modal functions
        function openModal(index) {
            currentModalIndex = index;
            updateModalImage();
            document.getElementById('imageModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('show');
            document.body.style.overflow = 'auto';
        }

        function updateModalImage() {
            const img = document.getElementById('modal-image');
            img.src = `optimized/${images[currentModalIndex].file}`;
        }

        function prevImage() {
            currentModalIndex = (currentModalIndex - 1 + images.length) % images.length;
            updateModalImage();
        }

        function nextImage() {
            currentModalIndex = (currentModalIndex + 1) % images.length;
            updateModalImage();
        }

// Header scroll effect
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            lastScrollTop = window.scrollY;
        });

        // Event listeners
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-prev').addEventListener('click', prevImage);
        document.getElementById('modal-next').addEventListener('click', nextImage);

        document.getElementById('imageModal').addEventListener('click', (e) => {
            if (e.target.id === 'imageModal') closeModal();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('imageModal').classList.contains('show')) return;
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'Escape') closeModal();
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initializeGallery();
        });
    </script>
</body>
</html>
