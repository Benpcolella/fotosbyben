<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licensing - Benedetto Colella</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; }
        body { font-family: 'Space Mono', monospace; background-color: #fafafa; color: #1a1a1a; line-height: 1.6; padding-top: 80px; }
        h1, h2, h3 { font-family: 'Space Mono', monospace; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
        header { position: fixed; top: 0; left: 0; right: 0; padding: 0.5rem 2rem; background: rgba(255, 255, 255, 0.98); z-index: 100; border-bottom: 1px solid #e0e0e0; }
        header > div { display: flex; justify-content: space-between; align-items: center; }
        header nav { display: flex; gap: 2rem; }
        .nav-link { color: #1a1a1a; text-decoration: none; font-size: 0.9rem; letter-spacing: 0.05em; transition: opacity 0.3s ease; }
        .nav-link:hover { opacity: 0.6; }
        footer { background-color: #1a1a1a; color: #ffffff; padding: 3rem 4rem; margin-top: 6rem; text-align: center; font-size: 0.95rem; letter-spacing: 0.05em; }
        footer a { color: #ffffff; }
        @media (max-width: 1024px) { header { padding: 1rem 2rem; } }
        @media (max-width: 768px) { header { padding: 1rem; } footer { padding: 2rem 1.5rem; } }


        .lic-intro { max-width: 1200px; margin: 0 auto; padding: 3rem 1.2rem 2rem; }
        .lic-intro h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .lic-intro p { max-width: 640px; color: #555; font-size: 1rem; line-height: 1.8; }
        .cover-grid { max-width: 1200px; margin: 0 auto 4rem; padding: 0 1.2rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .cover-card { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; background: #1a1a1a; color: #ffffff; text-decoration: none; }
        .cover-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .cover-card:hover img { transform: scale(1.04); }
        .cover-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 1.25rem; background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 55%); }
        .cover-count { font-size: 0.75rem; letter-spacing: 0.1em; opacity: 0.85; margin-bottom: 0.3rem; }
        .cover-overlay h2 { font-size: 1.1rem; line-height: 1.3; }
        @media (max-width: 768px) { .cover-grid { grid-template-columns: repeat(2, 1fr); } .lic-intro h1 { font-size: 2rem; } }

    </style>
</head>
<body>
    <header id="header">
        <div>
            <a href="index.html" style="text-decoration: none;">
                <img src="logo.png" alt="Fotos by Ben" style="height: 38px; width: auto; display: block;">
            </a>
            <nav>
                <a class="nav-link" href="index.html">Gallery</a>
                <a class="nav-link" href="licensing.html">Licensing</a>
                <a class="nav-link" href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="lic-intro">
            <h1>Licensing</h1>
            <p>Images available for commercial licensing. Choose a collection to see its photos, with title, resolution and description.</p>
        </section>
        <div class="cover-grid" id="cover-grid"></div>
    </main>

    <footer>
        <p>© 2026 Benedetto Colella | Image licensing available</p>
        <p style="margin-top: 1rem; font-size: 0.9rem;">Email: <a target="_blank" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=benpcolella@gmail.com" style="color: #ffffff; text-decoration: none; border-bottom: 1px solid #ffffff;">benpcolella@gmail.com</a> | Instagram: <a href="https://instagram.com/benedetto.jpeg" target="_blank" style="color: #ffffff; text-decoration: none; border-bottom: 1px solid #ffffff;">@benedetto.jpeg</a></p>
    </footer>

    <script src="licensing/collections.js"></script>
    <script>
        const grid = document.getElementById('cover-grid');
        window.LICENSING_COLLECTIONS.forEach(c => {
            const a = document.createElement('a');
            a.className = 'cover-card';
            a.href = 'licensing/collection.html?c=' + encodeURIComponent(c.slug);

            const img = document.createElement('img');
            img.src = typeof c.cover === 'number' ? 'thumbs/' + c.cover + '.jpg' : c.cover.src;
            img.alt = c.title;
            img.loading = 'lazy';

            const overlay = document.createElement('div');
            overlay.className = 'cover-overlay';
            const count = document.createElement('span');
            count.className = 'cover-count';
            count.textContent = c.photos.length + ' IMAGES';
            const h = document.createElement('h2');
            h.textContent = c.title;
            overlay.append(count, h);

            a.append(img);
            if (!c.designed) a.append(overlay);
            grid.appendChild(a);
        });
    </script>
</body>
</html>
